<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหารออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        * { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 text-white p-2 rounded-xl text-xl"><i class="fa-solid fa-utensils"></i></div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">ระบบสั่งอาหาร</h1>
                    <p class="text-xs text-gray-400">ร้านอาหารออนไลน์</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6 pb-24">
        <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-5 rounded-2xl shadow-md flex justify-between items-center">
            <div>
                <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-medium">บริการที่โต๊ะ</span>
                <h2 id="customerTableTitle" class="text-2xl font-extrabold mt-1">โต๊ะที่ 1</h2>
                <p class="text-xs text-orange-100 mt-0.5">เลือกอาหารและกดยืนยันเพื่อส่งเข้าครัวได้ทันที</p>
            </div>
        </div>

        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('menu')" id="tabMenuBtn" class="py-2.5 px-4 text-sm font-semibold border-b-2 border-orange-500 text-orange-600 flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> เมนูอาหาร
            </button>
            <button onclick="switchTab('orders')" id="tabOrdersBtn" class="py-2.5 px-4 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> รายการที่สั่งแล้ว
            </button>
        </div>

        <div id="menuView" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div id="ordersView" class="hidden space-y-4">
            <div id="customerOrdersList" class="space-y-3"></div>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="customerCartBar" class="hidden fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-40">
        <div class="bg-slate-900 text-white p-3.5 rounded-2xl shadow-xl flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 p-2.5 rounded-xl text-white font-bold text-sm">
                    <i class="fa-solid fa-basket-shopping"></i> <span id="cartTotalCount">0</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400">ราคารวมทั้งสิ้น</p>
                    <p id="cartTotalPrice" class="text-lg font-bold text-orange-400">฿0</p>
                </div>
            </div>
            <button onclick="openCartModal()" class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-xl font-semibold text-sm transition">
                ดูตะกร้าสินค้า <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="cartModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-cart-shopping text-orange-500"></i> ตะกร้าของคุณ</h3>
                <button onclick="closeCartModal()" class="text-gray-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cartItemsList" class="space-y-3 divide-y"></div>
            <div class="space-y-3 pt-3 border-t">
                <div class="flex justify-between items-center text-sm font-semibold">
                    <span>ยอดรวมทั้งหมด</span>
                    <span id="cartModalTotal" class="text-orange-600 text-lg">฿0</span>
                </div>
                <button onclick="submitOrder()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> ยืนยันการสั่งอาหาร
                </button>
            </div>
        </div>
    </div>

    <!-- Image Zoom Modal -->
    <div id="imageModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalImg" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-JnN-E2YAaQK83tsro_PK0yX7IxM98Oa9NXgJi9TClnEO1_qqI6BIQIT68DwNNYWE/exec";
        
        let currentTable = 1;
        let menuItems = JSON.parse(localStorage.getItem('restaurant_menu')) || [
            { id: "1", name: "ข้าวกะเพราหมูกรอบ", price: 60, category: "อาหารจานเดียว", image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=300" }
        ];
        let cart = [];
        let orders = JSON.parse(localStorage.getItem('restaurant_orders')) || [];

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('table')) currentTable = urlParams.get('table');
            document.getElementById('customerTableTitle').innerText = `โต๊ะที่ ${currentTable}`;

            renderCustomerMenu();
            renderCustomerOrders();
            setInterval(() => {
                orders = JSON.parse(localStorage.getItem('restaurant_orders')) || [];
                renderCustomerOrders();
            }, 3000);
        };

        function switchTab(tab) {
            if (tab === 'menu') {
                document.getElementById('menuView').classList.remove('hidden');
                document.getElementById('ordersView').classList.add('hidden');
                document.getElementById('tabMenuBtn').className = "py-2.5 px-4 text-sm font-semibold border-b-2 border-orange-500 text-orange-600 flex items-center gap-2";
                document.getElementById('tabOrdersBtn').className = "py-2.5 px-4 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 flex items-center gap-2";
            } else {
                document.getElementById('menuView').classList.add('hidden');
                document.getElementById('ordersView').classList.remove('hidden');
                document.getElementById('tabOrdersBtn').className = "py-2.5 px-4 text-sm font-semibold border-b-2 border-orange-500 text-orange-600 flex items-center gap-2";
                document.getElementById('tabMenuBtn').className = "py-2.5 px-4 text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-600 flex items-center gap-2";
            }
        }

        function renderCustomerMenu() {
            const container = document.getElementById('menuView');
            container.innerHTML = '';
            menuItems.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl border border-gray-100 p-3 flex space-x-3 shadow-sm">
                        <img src="${item.image}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 cursor-pointer hover:opacity-90" onclick="openImageModal('${item.image}')" onerror="this.src='https://placehold.co/100x100?text=Food'">
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
                                <p class="text-[10px] text-gray-400">${item.category || 'ทั่วไป'}</p>
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="font-extrabold text-sm text-orange-500">฿${item.price}</span>
                                <button onclick="addToCart('${item.id}')" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition">+ เพิ่ม</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openImageModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        function addToCart(itemId) {
            const item = menuItems.find(m => String(m.id) === String(itemId));
            if (!item) return;
            const existing = cart.find(c => String(c.id) === String(itemId));
            if (existing) existing.qty++;
            else cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('cartTotalCount').innerText = totalCount;
            document.getElementById('cartTotalPrice').innerText = `฿${totalPrice}`;
            if (totalCount > 0) document.getElementById('customerCartBar').classList.remove('hidden');
            else document.getElementById('customerCartBar').classList.add('hidden');
        }

        function openCartModal() {
            document.getElementById('cartModal').classList.remove('hidden');
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';
            let totalPrice = 0;
            cart.forEach((item, index) => {
                totalPrice += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center py-2 text-xs">
                        <div><b>${item.name}</b><br><span class="text-gray-400">฿${item.price} x ${item.qty}</span></div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeCartQty(${index}, -1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeCartQty(${index}, 1)" class="w-6 h-6 bg-orange-100 text-orange-600 rounded-lg font-bold">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cartModalTotal').innerText = `฿${totalPrice}`;
        }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        function changeCartQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI();
            openCartModal();
            if (cart.length === 0) closeCartModal();
        }

        function submitOrder() {
            if (cart.length === 0) return;
            const orderId = Date.now().toString();
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const newOrder = {
                id: orderId,
                table: currentTable,
                items: [...cart],
                total: totalPrice,
                status: 'pending',
                timeStr: timeStr,
                timestamp: now.toISOString()
            };

            orders.push(newOrder);
            localStorage.setItem('restaurant_orders', JSON.stringify(orders));

            if (GOOGLE_SCRIPT_URL) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: orderId,
                        table: currentTable,
                        items: cart.map(i => `${i.name} (x${i.qty})`).join(', '),
                        total: totalPrice,
                        status: 'pending',
                        timestamp: timeStr
                    })
                }).catch(err => console.log(err));
            }

            cart = [];
            updateCartUI();
            closeCartModal();
            switchTab('orders');
            alert('ส่งรายการสั่งอาหารสำเร็จ!');
        }

        function renderCustomerOrders() {
            const container = document.getElementById('customerOrdersList');
            container.innerHTML = '';
            const myOrders = orders.filter(o => Number(o.table) === Number(currentTable) && o.status !== 'completed');

            if (myOrders.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-400 text-xs">ยังไม่มีรายการที่กำลังรอดำเนินการในโต๊ะนี้</div>`;
                return;
            }

            myOrders.forEach(order => {
                let statusBadge = `<span class="text-amber-600 text-xs font-bold"><i class="fa-solid fa-hourglass"></i> รอดำเนินการ</span>`;
                if (order.status === 'cooking') statusBadge = `<span class="text-blue-600 text-xs font-bold"><i class="fa-solid fa-fire"></i> กำลังทำอาหาร</span>`;

                let itemsHtml = (order.items || []).map(i => `<div class="flex justify-between text-xs text-gray-700"><span>${i.name} x${i.qty}</span><span>฿${i.price * i.qty}</span></div>`).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                        <div class="flex justify-between items-center border-b pb-2 text-xs">
                            <span class="font-bold text-gray-600">ออเดอร์ #${String(order.id).slice(-4)}</span>
                            ${statusBadge}
                        </div>
                        <div class="space-y-1">${itemsHtml}</div>
                        <div class="flex justify-between items-center pt-2 border-t text-xs font-bold">
                            <span>รวม: <b class="text-orange-500">฿${order.total}</b></span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
