<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหาร - เจ้าของร้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        * { font-family: 'Kanit', sans-serif; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin-anim { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

<div id="adminNotification"
    class="hidden fixed top-5 right-5 bg-orange-500 text-white px-5 py-3 rounded-2xl shadow-2xl z-50">
    <p class="font-bold text-sm">มีออเดอร์ใหม่เข้ามา!</p>
    <p class="text-xs" id="notifDetail">มีรายการสั่งอาหารใหม่</p>
</div>

<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-orange-500 text-white p-2 rounded-xl text-xl">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">ระบบสั่งอาหาร</h1>
                <p class="text-xs text-gray-400">ระบบจัดการร้านอาหารออนไลน์</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="triggerRefresh()" class="px-3 py-2 bg-gray-100 text-gray-700 text-xs rounded-lg">
                <i id="refreshIcon" class="fa-solid fa-rotate-right"></i> รีเฟรช
            </button>
            <a href="index.html" target="_blank"
                class="px-3 py-2 text-xs font-semibold rounded-lg bg-orange-500 text-white">
                <i class="fa-solid fa-border-all"></i> หน้าลูกค้า
            </a>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
    <div class="bg-white p-4 rounded-2xl shadow-sm border flex flex-wrap justify-between items-center gap-3">
        <div>
            <h2 class="font-bold text-lg">
                <i class="fa-solid fa-chart-pie text-orange-500"></i>
                แผงควบคุมเจ้าของร้าน
            </h2>
            <p class="text-xs text-gray-400">จัดการคำสั่งซื้อและเมนูอาหาร</p>
        </div>
        <div class="flex gap-2">
            <a href="https://docs.google.com/spreadsheets/d/1oJMvQwIpAb9icpnFrqtRxJsRbuxiylB3LIZwVzgQHPA/edit"
                target="_blank"
                class="px-3 py-2 bg-emerald-50 text-emerald-600 text-xs rounded-xl border border-emerald-200">
                <i class="fa-solid fa-file-excel"></i> Google Sheets
            </a>
            <button onclick="openAddMenuModal()"
                class="px-3 py-2 bg-orange-500 text-white text-xs rounded-xl">
                <i class="fa-solid fa-plus"></i> เพิ่มเมนู
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border">
                <h3 class="font-bold text-sm">
                    <i class="fa-solid fa-receipt text-orange-500"></i>
                    รายการสั่งอาหารเข้า
                </h3>
                <span id="orderCountBadge"
                    class="bg-orange-100 text-orange-600 text-xs px-3 py-1 rounded-full">
                    0 รายการ
                </span>
            </div>

            <div class="flex flex-wrap gap-2 text-xs">
                <button onclick="filterOrders('all')" id="filterAll"
                    class="px-3 py-2 rounded-lg bg-slate-800 text-white">ทั้งหมด</button>
                <button onclick="filterOrders('pending')" id="filterPending"
                    class="px-3 py-2 rounded-lg bg-white border">รอดำเนินการ</button>
                <button onclick="filterOrders('cooking')" id="filterCooking"
                    class="px-3 py-2 rounded-lg bg-white border">กำลังทำอาหาร</button>
                <button onclick="filterOrders('completed')" id="filterCompleted"
                    class="px-3 py-2 rounded-lg bg-white border">เสร็จสิ้นแล้ว</button>
            </div>

            <div id="adminOrdersContainer" class="space-y-3"></div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border h-fit">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm">
                    <i class="fa-solid fa-list-check"></i> รายการอาหารทั้งหมด
                </h3>
                <button onclick="openAddMenuModal()" class="text-xs text-orange-500">+ เพิ่ม</button>
            </div>
            <div id="adminMenuList" class="space-y-2 max-h-96 overflow-y-auto"></div>
        </div>
    </div>
</main>

<div id="addMenuModal"
    class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
            <h3 id="menuModalTitle" class="font-bold">เพิ่มรายการอาหารใหม่</h3>
            <button onclick="closeAddMenuModal()" class="text-gray-400 text-xl">×</button>
        </div>

        <form id="addMenuForm" onsubmit="saveMenuItem(event)" class="space-y-3">
            <input type="hidden" id="editMenuId">

            <div>
                <label class="text-xs font-semibold">ชื่อเมนูอาหาร</label>
                <input type="text" id="menuName" required
                    class="w-full mt-1 border rounded-xl p-2.5 text-sm"
                    placeholder="เช่น ข้าวกะเพราหมูกรอบ">
            </div>

            <div>
                <label class="text-xs font-semibold">ราคา (บาท)</label>
                <input type="number" id="menuPrice" required min="1"
                    class="w-full mt-1 border rounded-xl p-2.5 text-sm"
                    placeholder="60">
            </div>

            <div>
                <label class="text-xs font-semibold">หมวดหมู่</label>
                <select id="menuCategory" class="w-full mt-1 border rounded-xl p-2.5 text-sm">
                    <option value="อาหารจานเดียว">อาหารจานเดียว</option>
                    <option value="กับข้าว">กับข้าว</option>
                    <option value="ทานเล่น">ทานเล่น</option>
                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-semibold">URL รูปภาพอาหาร</label>
                <input type="url" id="menuImage"
                    class="w-full mt-1 border rounded-xl p-2.5 text-sm"
                    placeholder="https://example.com/image.jpg">
            </div>

            <button type="submit"
                class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">
                บันทึกข้อมูล
            </button>
        </form>
    </div>
</div>

<div id="imageModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4"
    onclick="closeImageModal()">
    <img id="modalImg" src="" class="max-w-full max-h-[85vh] rounded-2xl object-contain">
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-JnN-E2YAaQK83tsro_PK0yX7IxM98Oa9NXgJi9TClnEO_1qqI6BIQIT68DwNNYWE/exec";

let menuItems = [];
let orders = [];
let previousOrderIds = new Set();
let currentFilter = "all";
let isFirstLoad = true;

function apiGet(action) {
    return new Promise((resolve, reject) => {
        const callbackName = "gasCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");

        const timer = setTimeout(() => {
            cleanup();
            reject(new Error("หมดเวลารอข้อมูลจาก Google Sheets"));
        }, 15000);

        function cleanup() {
            clearTimeout(timer);
            try { delete window[callbackName]; } catch (_) {
                window[callbackName] = undefined;
            }
            if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = data => {
            cleanup();
            resolve(data);
        };

        script.onerror = () => {
            cleanup();
            reject(new Error("เชื่อมต่อ Google Apps Script ไม่สำเร็จ"));
        };

        script.src = GOOGLE_SCRIPT_URL
            + "?action=" + encodeURIComponent(action)
            + "&callback=" + callbackName
            + "&_=" + Date.now();

        document.body.appendChild(script);
    });
}

async function apiPost(data) {
    await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
    });

    await new Promise(resolve => setTimeout(resolve, 900));
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[c]));
}

function normalizeItems(items) {
    if (typeof items === "string") {
        try { items = JSON.parse(items); } catch (_) { return []; }
    }

    if (!Array.isArray(items)) return [];

    return items.map(item => ({
        name: item.name || "รายการอาหาร",
        price: Number(item.price) || 0,
        qty: Number(item.qty ?? item.quantity) || 1
    }));
}

async function loadSharedData() {
    const data = await apiGet("init");

    if (!data || data.result !== "success") {
        throw new Error(data?.message || "อ่านข้อมูลไม่สำเร็จ");
    }

    menuItems = Array.isArray(data.menu) ? data.menu : [];
    orders = Array.isArray(data.orders) ? data.orders : [];

    const newOrders = orders.filter(order => !previousOrderIds.has(String(order.id)));

    if (!isFirstLoad && newOrders.length) {
        document.getElementById("notifDetail").innerText =
            "มีออเดอร์ใหม่ " + newOrders.length + " รายการ";
        document.getElementById("adminNotification").classList.remove("hidden");
        playSound();

        setTimeout(() => {
            document.getElementById("adminNotification").classList.add("hidden");
        }, 5000);
    }

    previousOrderIds = new Set(orders.map(order => String(order.id)));
    isFirstLoad = false;

    renderAdminOrders();
    renderMenuList();
}

window.onload = async function() {
    try {
        await loadSharedData();
    } catch (err) {
        console.error(err);
        document.getElementById("adminOrdersContainer").innerHTML =
            `<div class="bg-white p-8 rounded-2xl text-center text-red-500 text-sm">
                โหลดข้อมูลไม่ได้: ${escapeHtml(err.message)}<br>
                ตรวจสอบ URL และการ Deploy ของ Apps Script
            </div>`;
    }

    setInterval(() => {
        loadSharedData().catch(err => console.warn(err));
    }, 8000);
};

async function triggerRefresh() {
    const icon = document.getElementById("refreshIcon");
    icon.classList.add("spin-anim");

    try {
        await loadSharedData();
    } catch (err) {
        alert("รีเฟรชไม่สำเร็จ: " + err.message);
    } finally {
        icon.classList.remove("spin-anim");
    }
}

function playSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
    } catch (err) {}
}

function filterOrders(status) {
    currentFilter = status;

    ["all", "pending", "cooking", "completed"].forEach(s => {
        const id = "filter" + s.charAt(0).toUpperCase() + s.slice(1);
        const button = document.getElementById(id);

        if (button) {
            button.className = s === status
                ? "px-3 py-2 rounded-lg bg-slate-800 text-white"
                : "px-3 py-2 rounded-lg bg-white border text-gray-600";
        }
    });

    renderAdminOrders();
}

function renderAdminOrders() {
    const container = document.getElementById("adminOrdersContainer");
    container.innerHTML = "";

    const filtered = (
        currentFilter !== "all"
            ? orders.filter(order => order.status === currentFilter)
            : orders
    ).slice().sort((a, b) =>
        new Date(b.timestamp || 0) - new Date(a.timestamp || 0)
    );

    document.getElementById("orderCountBadge").innerText =
        filtered.length + " รายการ";

    if (!filtered.length) {
        container.innerHTML = `
            <div class="bg-white p-12 rounded-2xl text-center text-gray-400 text-sm border">
                <i class="fa-solid fa-utensils text-3xl text-gray-300"></i>
                <p class="mt-3">ยังไม่มีรายการสั่งอาหารเข้ามาในขณะนี้</p>
            </div>`;
        return;
    }

    filtered.forEach(order => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl shadow-sm border space-y-3";

        let statusBadge =
            '<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full">รอดำเนินการ</span>';

        if (order.status === "cooking") {
            statusBadge =
                '<span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full">กำลังทำอาหาร</span>';
        }

        if (order.status === "completed") {
            statusBadge =
                '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full">เสร็จสิ้นแล้ว</span>';
        }

        const itemsHtml = normalizeItems(order.items).map(item => `
            <div class="flex justify-between text-xs text-gray-700">
                <span><b>${escapeHtml(item.name)}</b> x${item.qty}</span>
                <span>฿${item.price * item.qty}</span>
            </div>
        `).join("");

        let actionBtn = "";

        if (order.status === "pending") {
            actionBtn = `
                <button data-id="${escapeHtml(order.id)}" data-status="cooking"
                    class="status-btn w-full py-2 bg-blue-500 text-white text-xs font-bold rounded-xl">
                    <i class="fa-solid fa-fire"></i> เริ่มทำอาหาร
                </button>`;
        } else if (order.status === "cooking") {
            actionBtn = `
                <button data-id="${escapeHtml(order.id)}" data-status="completed"
                    class="status-btn w-full py-2 bg-emerald-500 text-white text-xs font-bold rounded-xl">
                    <i class="fa-solid fa-check"></i> กดเสร็จแล้ว
                </button>`;
        }

        card.innerHTML = `
            <div class="flex justify-between items-center border-b pb-2 gap-2">
                <div>
                    <span class="font-extrabold text-sm bg-slate-900 text-white px-2 py-1 rounded-md">
                        โต๊ะที่ ${escapeHtml(order.table)}
                    </span>
                    <p class="text-xs text-gray-400 mt-2">
                        หมายเลขออเดอร์: ${escapeHtml(String(order.id))}
                    </p>
                </div>
                ${statusBadge}
            </div>

            <div class="space-y-2 bg-gray-50 p-3 rounded-xl">
                ${itemsHtml}
            </div>

            <div class="flex justify-between items-center font-bold text-sm">
                <span>ราคารวม</span>
                <b class="text-orange-500">฿${Number(order.total) || 0}</b>
            </div>
            ${actionBtn}`;

        const statusButton = card.querySelector(".status-btn");

        if (statusButton) {
            statusButton.addEventListener("click", () => {
                updateOrderStatus(statusButton.dataset.id, statusButton.dataset.status);
            });
        }

        container.appendChild(card);
    });
}

async function updateOrderStatus(orderId, newStatus) {
    try {
        await apiPost({
            action: "updateStatus",
            id: String(orderId),
            status: newStatus
        });

        await loadSharedData();

        const updated = orders.find(order => String(order.id) === String(orderId));

        if (!updated || updated.status !== newStatus) {
            throw new Error("ยังยืนยันการเปลี่ยนสถานะจาก Google Sheets ไม่ได้");
        }
    } catch (err) {
        alert("อัปเดตสถานะไม่สำเร็จ: " + err.message);
    }
}

function renderMenuList() {
    const container = document.getElementById("adminMenuList");
    container.innerHTML = "";

    if (!menuItems.length) {
        container.innerHTML =
            '<p class="text-xs text-gray-400 text-center py-4">ยังไม่มีเมนูอาหาร</p>';
        return;
    }

    menuItems.forEach(item => {
        const div = document.createElement("div");
        div.className = "flex items-center justify-between p-2 bg-gray-50 rounded-xl gap-2";

        div.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
                <img src="${escapeHtml(item.image || "https://placehold.co/100x100?text=Food")}"
                    class="w-12 h-12 rounded-lg object-cover"
                    onerror="this.src='https://placehold.co/100x100?text=Food'">
                <div class="truncate">
                    <h4 class="font-bold text-xs truncate">${escapeHtml(item.name)}</h4>
                    <p class="text-xs text-gray-500">
                        ฿${Number(item.price) || 0} • ${escapeHtml(item.category || "ทั่วไป")}
                    </p>
                </div>
            </div>
            <div class="flex gap-1">
                <button class="edit-btn p-2 text-orange-500" title="แก้ไข">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="delete-btn p-2 text-red-500" title="ลบ">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>`;

        div.querySelector(".edit-btn").onclick = () => editMenuItem(item.id);
        div.querySelector(".delete-btn").onclick = () => deleteMenuItem(item.id);

        container.appendChild(div);
    });
}

function openAddMenuModal() {
    document.getElementById("editMenuId").value = "";
    document.getElementById("menuModalTitle").innerText = "เพิ่มรายการอาหารใหม่";
    document.getElementById("addMenuForm").reset();
    document.getElementById("addMenuModal").classList.remove("hidden");
}

function closeAddMenuModal() {
    document.getElementById("addMenuModal").classList.add("hidden");
}

function editMenuItem(id) {
    const item = menuItems.find(menu => String(menu.id) === String(id));
    if (!item) return;

    document.getElementById("editMenuId").value = item.id;
    document.getElementById("menuName").value = item.name;
    document.getElementById("menuPrice").value = item.price;
    document.getElementById("menuCategory").value = item.category || "อาหารจานเดียว";
    document.getElementById("menuImage").value = item.image || "";
    document.getElementById("menuModalTitle").innerText = "แก้ไขรายการอาหาร";
    document.getElementById("addMenuModal").classList.remove("hidden");
}

async function saveMenuItem(event) {
    event.preventDefault();

    const editId = document.getElementById("editMenuId").value;

    const item = {
        id: editId || Date.now().toString(),
        name: document.getElementById("menuName").value.trim(),
        price: Number(document.getElementById("menuPrice").value),
        category: document.getElementById("menuCategory").value,
        image: document.getElementById("menuImage").value.trim()
            || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300"
    };

    if (!item.name || item.price <= 0) {
        alert("กรุณากรอกชื่อเมนูและราคาที่ถูกต้อง");
        return;
    }

    const updated = menuItems.slice();
    const index = updated.findIndex(menu => String(menu.id) === String(editId));

    if (index >= 0) updated[index] = item;
    else updated.push(item);

    try {
        await apiPost({ action: "updateMenu", menu: updated });
        await loadSharedData();

        if (!menuItems.some(menu =>
            String(menu.id) === String(item.id) && menu.name === item.name
        )) {
            throw new Error("ยังไม่พบเมนูที่บันทึกใน Google Sheets");
        }

        closeAddMenuModal();
        alert("บันทึกเมนูเรียบร้อยแล้ว");
    } catch (err) {
        alert("บันทึกเมนูไม่สำเร็จ: " + err.message);
    }
}

async function deleteMenuItem(id) {
    if (!confirm("ยืนยันลบเมนูนี้หรือไม่?")) return;

    const updated = menuItems.filter(item => String(item.id) !== String(id));

    try {
        await apiPost({ action: "updateMenu", menu: updated });
        await loadSharedData();

        if (menuItems.some(item => String(item.id) === String(id))) {
            throw new Error("เมนูยังอยู่ใน Google Sheets");
        }

        alert("ลบเมนูเรียบร้อยแล้ว");
    } catch (err) {
        alert("ลบเมนูไม่สำเร็จ: " + err.message);
    }
}

function openImageModal(url) {
    document.getElementById("modalImg").src = url;
    document.getElementById("imageModal").classList.remove("hidden");
}

function closeImageModal() {
    document.getElementById("imageModal").classList.add("hidden");
}
</script>
</body>
</html>
